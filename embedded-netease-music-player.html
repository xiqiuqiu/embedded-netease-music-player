    <header>
        <meta charset="UTF-8"/>
        <style>
            body {
                font-family: "Segoe UI", Helvetica, sans-serif;
                font-size: 1rem;
                background: #1a1a1a;
                margin: 0;
                padding: 0;
            }

            #player {
                position: relative;
                background: linear-gradient(135deg, #2a2a2a 0%, #1e1e1e 100%);
                border: 2px solid #444;
                border-radius: 4px;
                box-shadow: 0 0 20px rgba(0, 255, 255, 0.1), inset 0 0 10px rgba(0, 0, 0, 0.5);
                padding: 0;
                overflow: hidden;
            }

            /* Top Status Bar */
            #statusBar {
                background: linear-gradient(180deg, #3a3a3a 0%, #2a2a2a 100%);
                border-bottom: 1px solid #555;
                padding: 0.3em 0.5em;
                display: flex;
                justify-content: space-between;
                align-items: center;
                height: 1.2em;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            }

            #statusBar .status-label {
                color: #0ff;
                font-size: 0.65rem;
                font-weight: bold;
                text-transform: uppercase;
                letter-spacing: 1px;
                text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
            }

            /* Pulse Indicators */
            #pulseIndicators {
                display: flex;
                gap: 0.4em;
            }

            .pulse-indicator {
                width: 0.5em;
                height: 0.5em;
                border-radius: 50%;
                background: #0f0;
                box-shadow: 0 0 8px #0f0, inset 0 0 3px rgba(255, 255, 255, 0.3);
                animation: pulse 2s ease-in-out infinite;
            }

            .pulse-indicator:nth-child(2) {
                background: #ff0;
                box-shadow: 0 0 8px #ff0, inset 0 0 3px rgba(255, 255, 255, 0.3);
                animation-delay: 0.3s;
            }

            .pulse-indicator:nth-child(3) {
                background: #f00;
                box-shadow: 0 0 8px #f00, inset 0 0 3px rgba(255, 255, 255, 0.3);
                animation-delay: 0.6s;
            }

            @keyframes pulse {
                0%, 100% {
                    opacity: 1;
                    transform: scale(1);
                }
                50% {
                    opacity: 0.3;
                    transform: scale(0.8);
                }
            }

            /* Scanline Overlay */
            #scanlineOverlay {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 0, 0, 0.1) 2px,
                    rgba(0, 0, 0, 0.1) 4px
                );
                pointer-events: none;
                z-index: 10;
                animation: scanline 8s linear infinite;
            }

            @keyframes scanline {
                0% {
                    transform: translateY(0);
                }
                100% {
                    transform: translateY(4px);
                }
            }

            /* Main Content Area */
            #mainContent {
                padding: 0.8em;
                position: relative;
                z-index: 1;
            }

            #songPicContainer {
                float: left;
                margin-right: 0.5em;
                border: 2px solid #555;
                border-radius: 2px;
                box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
            }

            #songPic {
                width: 3em;
                height: 3em;
                display: block;
            }

            #infobar, #controlbar {
                height: 50%;
            }

            #title {
                color: #0ff;
                font-size: 0.95rem;
                text-shadow: 0 0 3px rgba(0, 255, 255, 0.5);
            }

            #artist {
                color: #aaa;
                font-size: 0.75rem;
                margin: 0.5em;
            }
            
            #alias {
                color: #888;
                font-size: 0.7rem;
                margin: 0.5em;
            }

            #time {
                color: #0f0;
                line-height: 50%;
                font-size: 0.7rem;
                text-shadow: 0 0 3px rgba(0, 255, 0, 0.5);
            }

            #lyricsbar {
                margin-top: 0.5em;
                padding: 0.3em;
                background: rgba(0, 0, 0, 0.3);
                border-radius: 2px;
                border: 1px solid #333;
            }

            #lyric, #tlyric {
                float: none;
            }

            #lyric {
                color: #0ff;
                font-size: 0.85rem;
                text-shadow: 0 0 2px rgba(0, 255, 255, 0.3);
            }

            #tlyric {
                color: #888;
                font-size: 0.8rem;
            }

            .controlbtnLink {
                text-decoration: none;
                vertical-align: sub;
            }

            .controlbtn {
                width: 1em;
                height: 1em;
                padding-right: 0.5em;
                filter: brightness(1.2) drop-shadow(0 0 2px rgba(0, 255, 255, 0.3));
            }

            /* Bottom Spectrum Bars */
            #spectrumBars {
                display: flex;
                justify-content: space-around;
                align-items: flex-end;
                height: 2em;
                background: linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 100%);
                border-top: 1px solid #555;
                padding: 0.3em 0.5em;
                gap: 2px;
            }

            .spectrum-bar {
                flex: 1;
                background: linear-gradient(180deg, #0ff 0%, #0aa 50%, #066 100%);
                border-radius: 1px 1px 0 0;
                box-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
                animation: spectrum 1.5s ease-in-out infinite;
                min-height: 10%;
            }

            .spectrum-bar:nth-child(1) { animation-delay: 0s; }
            .spectrum-bar:nth-child(2) { animation-delay: 0.1s; }
            .spectrum-bar:nth-child(3) { animation-delay: 0.2s; }
            .spectrum-bar:nth-child(4) { animation-delay: 0.3s; }
            .spectrum-bar:nth-child(5) { animation-delay: 0.4s; }
            .spectrum-bar:nth-child(6) { animation-delay: 0.5s; }
            .spectrum-bar:nth-child(7) { animation-delay: 0.4s; }
            .spectrum-bar:nth-child(8) { animation-delay: 0.3s; }
            .spectrum-bar:nth-child(9) { animation-delay: 0.2s; }
            .spectrum-bar:nth-child(10) { animation-delay: 0.1s; }
            .spectrum-bar:nth-child(11) { animation-delay: 0s; }
            .spectrum-bar:nth-child(12) { animation-delay: 0.1s; }
            .spectrum-bar:nth-child(13) { animation-delay: 0.2s; }
            .spectrum-bar:nth-child(14) { animation-delay: 0.3s; }
            .spectrum-bar:nth-child(15) { animation-delay: 0.4s; }
            .spectrum-bar:nth-child(16) { animation-delay: 0.5s; }
            .spectrum-bar:nth-child(17) { animation-delay: 0.4s; }
            .spectrum-bar:nth-child(18) { animation-delay: 0.3s; }
            .spectrum-bar:nth-child(19) { animation-delay: 0.2s; }
            .spectrum-bar:nth-child(20) { animation-delay: 0.1s; }

            @keyframes spectrum {
                0%, 100% {
                    height: 15%;
                }
                50% {
                    height: 80%;
                }
            }

        </style>
    </header>

        <script text="javascript">
            function get(url, callback) {
                var xhr = new XMLHttpRequest();
                xhr.onreadystatechange = function() {
                    if (this.readyState == 4 && this.status == 200) {
                        callback(this.responseText);
                    }
                };
                xhr.open("GET", url);
                xhr.send();
            }

            function formatSeconds(seconds) {
                var minutes = Math.floor(seconds / 60);
                var secondsRemain = Math.floor(seconds % 60);
                return String(minutes).padStart(2, "0") + ":" + String(secondsRemain).padStart(2, "0");
            }

            var detailsNode = document.getElementById("details");
            var audioNode = document.getElementById("audio");
            var songPicNode = document.getElementById("songPic");
            var titleNode = document.getElementById("title");
            var artistNode = document.getElementById("artist");
            var aliasNode = document.getElementById("alias");
            var timeNode = document.getElementById("time");
            var lyricNode = document.getElementById("lyric");
            var tlyricNode = document.getElementById("tlyric");
            var nmLinkNode = document.getElementById("nmLink");
            var playImgNode = document.getElementById("playImg");
            var pauseImgNode = document.getElementById("pauseImg");

            var lyrics;
            var tlyrics;

            function retrieveSong(id) {
                get(
                    "https://nmapi.dontpanic.fun/song/url?id=" + id,
                    (data) => {
                        createPlayer(JSON.parse(data).data[0]);
                    });
            }

            function retrieveDetails(id) {
                get(
                    "https://nmapi.dontpanic.fun/song/detail?ids=" + id,
                    (data) => {
                        setDetails(JSON.parse(data).songs[0]);
                    });
            }

            function retrieveLyric(id) {
                get(
                    "https://nmapi.dontpanic.fun/lyric?id=" + id,
                    (data) => {
                        var lyricsText = JSON.parse(data);
                        lyrics = parseLyrics(lyricsText.lrc.lyric);
                        tlyrics = parseLyrics(lyricsText.tlyric.lyric)
                    });
            }

            function createPlayer(song) {
                audioNode.src = song.url;
                audioNode.loop = "loop";

                var body = document.getElementsByTagName("body")[0];
                body.appendChild(audioNode);
            }

            function setDetails(details) {
                titleNode.innerHTML = details.name;
                artistNode.innerHTML = " - " + details.ar[0].name;
                if (details.alia[0]) {
                    aliasNode.innerHTML = "(" + details.alia[0] + ")";
                }

                songPicNode.src = details.al.picUrl;
            }

            function parseLyrics(lyricsText) {
                var lyrics = [];
                var lines = lyricsText.split("\n");
                for (var i = 0; i < lines.length; i++) {
                    var arr = /^\[([\d:.]*)]/g.exec(lines[i]);
                    if (arr == null) {
                        continue;
                    }

                    var text = lines[i].replace(arr[0], "");
                    var time = arr[1].split(":");
                    time.reverse();

                    var seconds = 0;
                    var mutiplier = 1;
                    for (var j = 0; j < 3; j++) {
                        if (time[j] != undefined) {
                            seconds += parseFloat(time[j]) * mutiplier;
                            mutiplier *= 60;
                        }
                    }

                    lyrics.push({seconds, text});
                }

                lyrics.reverse();
                return lyrics;
            }

            function updateLyrics(currentTime, lyricsNode, lyrics) {
                for (var i = 0; i < lyrics.length; i++) {
                    if (lyrics[i].seconds < currentTime) {
                        lyricsNode.innerHTML = lyrics[i].text;
                        break;
                    }
                }
            }

            function playPause() {
                if (audioNode.paused) {
                    audioNode.play();
                    playImgNode.style.display = "none";
                    pauseImgNode.style.display = "inline";
                } else {
                    audioNode.pause();
                    playImgNode.style.display = "inline";
                    pauseImgNode.style.display = "none";
                }
            }

            audioNode.addEventListener(
                "timeupdate",
                () => {
                    time.innerHTML = formatSeconds(audioNode.currentTime) + " / " + formatSeconds(audioNode.duration);
                    updateLyrics(audioNode.currentTime, lyricNode, lyrics);
                    updateLyrics(audioNode.currentTime, tlyricNode, tlyrics);
                });

            function initialize(id) {
                retrieveSong(id);
                retrieveDetails(id);
                retrieveLyric(id);
                nmLinkNode.href = "http://music.163.com/song?id=" + id;
            }

            var id = window.location.search.substring(1);
            if (id != undefined && id != "") {
                initialize(id);
            }
        </script>
